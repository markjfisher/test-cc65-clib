MEMORY {
    ZP:             start = $0002, size = $007D, type = rw;
    PRINT_BUF:      start = $C800, size = $0300, file = "";
    HARNESS:        start = $1900, size = $2000, file = %O;
    MOS_VECTORS_M:  start = $FFB9, size =    65, file = %O, define = no;
    V_RST:          start = $FFFC, size =     2, file = %O, define = no;
}
FILES {
    %O: format = atari;
}
SEGMENTS {
    ZEROPAGE:       load = ZP,              type = zp;
    STARTUP:        load = HARNESS,         type = rw, define = no;
    CODE:           load = HARNESS,         type = rw, define = no;
    MOS_VECTORS:    load = MOS_VECTORS_M,   type = ro, define = no;
    V_RESET:        load = V_RST,           type = ro, define = no;
}